<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV商品比較 | Shopee Research</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17372f;background:#f4f7f4}body{margin:0}header{background:#193d32;color:white;padding:18px}main{max-width:900px;margin:auto;padding:18px}a{color:#147c65}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #17372f13}input[type=file]{max-width:100%;padding:12px;border:1px dashed #719688;border-radius:10px}button{border:0;background:#193d32;color:white;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.45}.hint{color:#596b65;font-size:.9rem}.warn{background:#fff4dc;padding:12px;border-radius:8px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid #dde5df;text-align:left;vertical-align:top}th{white-space:nowrap;background:#f1f6f2}td:nth-child(1){min-width:180px}td:nth-child(7){min-width:160px}.ok{color:#166b46}.ng{color:#a34729}summary{cursor:pointer}#message{white-space:pre-wrap}small{font-size:.78rem}
</style></head><body><header><strong>Shopee Research</strong>　CSV商品比較</header><main>
<p><a href="./index.html">← 利益計算に戻る</a></p>
<section class="panel"><h1>Muse CSVを読み込む</h1><p>ごまちゃんのCSVを選ぶと、商品一覧・利益・判定を表示します。データはこの端末内で処理し、サーバーには送信しません。</p>
<input type="file" id="csv" accept=".csv,text/csv"><p id="message" role="status" class="hint">CSVを選んでください。</p></section>
<section class="panel"><h2>比較結果 <small id="count"></small></h2>
<p class="warn">⚠ CSVの利益額・利益率は元データの推定値です。手数料・実際の送料・為替などが未確定の場合、確定利益ではありません。CSVの判定も再計算していません。</p>
<div class="scroll"><table><thead><tr><th>商品名</th><th>販売 SGD</th><th>仕入 円</th><th>送料 円</th><th>予想利益 円</th><th>利益率</th><th>判定・備考</th></tr></thead><tbody id="rows"><tr><td colspan="7">CSV未読み込み</td></tr></tbody></table></div></section></main>
<script>
'use strict';
const input=document.getElementById('csv'),message=document.getElementById('message'),tbody=document.getElementById('rows'),count=document.getElementById('count');
function parseCSV(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=false}else{cell+=c}}else if(c==='"'){quoted=true}else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else{cell+=c}}if(quoted)throw Error('引用符が閉じられていません');row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function cell(tr,value){const td=document.createElement('td');td.textContent=value||'—';tr.append(td);return td}
input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;try{if(file.size>2e6)throw Error('CSVが大きすぎます（2MBまで）');const text=await file.text();const data=parseCSV(text.replace(/^\uFEFF/,''));if(data.length<2)throw Error('商品データが見つかりません');const header=data[0].map(s=>s.trim());const required=['商品名','Shopee販売価格','国内仕入れ価格','送料','予想利益','利益率','商品URL','判定','備考'];const ix=required.map(s=>header.findIndex(h=>h.includes(s)));if(ix.some(i=>i<0))throw Error('CSVの列名が想定と異なります。Museの商品リサーチCSVを選んでください。');tbody.replaceChildren();let n=0;for(const row of data.slice(1)){if(!row.some(x=>x.trim()))continue;const tr=document.createElement('tr');const val=i=>row[ix[i]]||'';cell(tr,val(0));cell(tr,val(1));cell(tr,val(2));cell(tr,val(3));cell(tr,val(4));cell(tr,val(5)+'%');const td=document.createElement('td');const status=document.createElement('strong');status.textContent=val(7);status.className=val(7).includes('不合格')?'ng':'ok';td.append(status);const url=val(6);if(/^https:\/\/[^\s]+$/i.test(url)){const p=document.createElement('p'),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Shopeeの商品ページ';p.append(a);td.append(p)}const details=document.createElement('details'),summary=document.createElement('summary'),note=document.createElement('p');summary.textContent='根拠・注意事項';note.textContent=val(8);details.append(summary,note);td.append(details);tr.append(td);tbody.append(tr);n++}count.textContent=n+'件';message.textContent=file.name+' を読み込みました。';}catch(e){message.textContent='読み込み失敗: '+e.message;count.textContent='';tbody.replaceChildren();cell(document.createElement('tr'),'');}});</script>
</body></html>
