<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV商品比較 | Shopee Research</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17372f;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}header{background:#193d32;color:white;padding:18px}main{max-width:900px;margin:auto;padding:18px}a{color:#147c65}.panel{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #17372f13}input[type=file]{max-width:100%;padding:12px;border:1px dashed #719688;border-radius:10px}.hint{color:#596b65;font-size:.9rem}.warn{background:#fff4dc;padding:12px;border-radius:8px;font-size:.9rem}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}select{font:inherit;padding:10px;border:1px solid #9bb4a8;border-radius:9px;background:white;color:#17372f}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:14px}.product{border:1px solid #dbe6df;border-radius:14px;padding:16px;background:#fff}.product h3{font-size:1.08rem;margin:0 0 10px;line-height:1.5;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.metric{background:#f3f7f4;border-radius:9px;padding:10px}.metric small{display:block;color:#596b65;margin-bottom:4px}.metric strong{font-size:1.15rem}.flag{display:inline-block;background:#fff0d5;color:#85541a;border-radius:7px;padding:5px 8px;font-size:.82rem}.note{font-size:.88rem;color:#596b65;overflow-wrap:anywhere}.detail{margin-top:12px;border-top:1px solid #e0e9e2;padding-top:10px}summary{cursor:pointer;color:#147c65}.status{font-weight:700}#message{white-space:pre-wrap}
</style></head><body><header><strong>Shopee Research</strong>　CSV商品比較</header><main>
<p><a href="./index.html">← 利益計算に戻る</a></p>
<section class="panel"><h1>Muse CSVを読み込む</h1><p>ごまちゃんのCSVを選ぶと、商品をスマホで比較できます。データは端末内で処理し、サーバーには送信しません。</p><input type="file" id="csv" accept=".csv,text/csv"><p id="message" role="status" class="hint">CSVを選んでください。</p></section>
<section class="panel"><h2>比較結果 <small id="count"></small></h2><p class="warn">⚠ 予想利益・利益率・判定はCSVの推定値です。送料・仕入れ・手数料・為替などの未確認項目があれば確定利益ではありません。利益は再計算していません。</p>
<div class="toolbar"><label for="sort">並び順</label><select id="sort"><option value="original">CSVの順番</option><option value="profit">予想利益が高い順</option><option value="profit-asc">予想利益が低い順</option><option value="name">商品名順</option></select></div>
<p id="duplicates" class="hint"></p><div id="products" class="products"><p>CSV未読み込み</p></div></section></main>
<script>
'use strict';
const input=document.getElementById('csv'),message=document.getElementById('message'),products=document.getElementById('products'),count=document.getElementById('count'),duplicates=document.getElementById('duplicates'),sort=document.getElementById('sort');
let entries=[];
function parseCSV(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=false}else{quoted=false}if(c!=='"')cell+=c}else if(c==='"'){quoted=true}else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('引用符が閉じられていません');row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function numeric(s){const t=String(s||'').replace(/[,，円%％\s]/g,'');return t!==''&&/^-?\d+(?:\.\d+)?$/.test(t)?Number(t):null}
function normalize(s){return String(s).normalize('NFKC').toLowerCase().replace(/[\s\u3000]+/g,'').replace(/[()（）\[\]「」・,，]/g,'')}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function metric(parent,label,value){const n=el('div','metric');n.append(el('small','',label),el('strong','',value));parent.append(n)}
function render(){products.replaceChildren();const data=[...entries];if(sort.value==='profit'||sort.value==='profit-asc'){data.sort((a,b)=>{const x=numeric(a.profit),y=numeric(b.profit);if(x===null)return y===null?a.index-b.index:1;if(y===null)return -1;return (sort.value==='profit'?y-x:x-y)||a.index-b.index})}else if(sort.value==='name')data.sort((a,b)=>a.name.localeCompare(b.name,'ja'));for(const item of data){const card=el('article','product');card.append(el('h3','',item.name));const missing=numeric(item.purchase)===null;const warning=missing?'仕入れ価格が未確認':null;if(warning)card.append(el('span','flag',warning));const metrics=el('div','metrics');metric(metrics,'販売価格',item.sale?item.sale+' SGD':'不明');metric(metrics,'予想利益',numeric(item.profit)!==null?item.profit+' 円（推定）':'不明');metric(metrics,'利益率',numeric(item.rate)!==null?item.rate+'%（推定）':'不明');metric(metrics,'国内仕入れ',item.purchase||'不明');metric(metrics,'送料',item.shipping?item.shipping+' 円':'不明');card.append(metrics);card.append(el('p','status',item.verdict||'判定なし'));if(missing)card.append(el('p','note','仕入れ価格が不明なため、予想利益は採用判断に使わず要確認。'));if(/^https:\/\/[^\s]+$/i.test(item.url)){const link=el('a','','商品ページを開く');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';card.append(link)}const detail=el('details','detail'),summary=el('summary','','根拠・注意事項'),note=el('p','note',item.notes||'記載なし');detail.append(summary,note);card.append(detail);products.append(card)}count.textContent=entries.length+'商品';if(!entries.length)products.append(el('p','','商品がありません'))}
sort.addEventListener('change',render);
input.addEventListener('change',async()=>{const file=input.files[0];if(!file)return;try{if(file.size>2e6)throw Error('CSVが大きすぎます（2MBまで）');const data=parseCSV((await file.text()).replace(/^\uFEFF/,''));if(data.length<2)throw Error('商品データが見つかりません');const header=data[0].map(s=>s.trim());const required=['商品名','Shopee販売価格','国内仕入れ価格','送料','予想利益','利益率','商品URL','判定','備考'];const ix=required.map(s=>header.findIndex(h=>h.includes(s)));if(ix.some(i=>i<0))throw Error('CSVの列名が想定と異なります。Museの商品リサーチCSVを選んでください。');const seen=new Set(),unique=[];let removed=0;for(const [index,row] of data.slice(1).entries()){if(!row.some(x=>x.trim()))continue;const val=i=>(row[ix[i]]||'').trim();const name=val(0);const key=normalize(name);if(!key)continue;if(seen.has(key)){removed++;continue}seen.add(key);unique.push({index,name,sale:val(1),purchase:val(2),shipping:val(3),profit:val(4),rate:val(5),url:val(6),verdict:val(7),notes:val(8)})}entries=unique;duplicates.textContent=removed?removed+'件の同名商品を重複として除外しました（最初の行を採用）。':'重複商品はありません。';message.textContent=file.name+' を読み込みました。';render()}catch(e){entries=[];count.textContent='';duplicates.textContent='';products.replaceChildren(el('p','','CSVを読み込めませんでした'));message.textContent='読み込み失敗: '+e.message}});
</script></body></html>
